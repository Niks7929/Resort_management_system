{% extends "base.html" %}{% from "macros.html" import field %}
{% block content %}
<div style="max-width:460px"><h2 class="h4 mb-3">Change password</h2>
<form method="post" novalidate>{{ form.hidden_tag() }}{{ field(form.current) }}{{ field(form.password) }}{{ field(form.confirm) }}
<button class="btn btn-primary">Save new password</button></form></div>
{% endblock %}
